name: Release site

# Publishes the consumer site (dist/ only) to the production bucket.
# Manual for now. It runs in the "prod" environment, which needs an approval and only accepts main.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for keyless Google Cloud authentication

concurrency:
  group: release-site
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build dist/ from the allow-list
        run: npm run build:consumer

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SITE_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish to Cloud Storage
        env:
          BUCKET: ${{ vars.GCP_PROJECT_ID }}-site
        run: |
          # Everything: short cache. Hashed build assets: long cache.
          gcloud storage rsync dist "gs://${BUCKET}" --recursive --delete-unmatched-destination-objects \
            --cache-control="public, max-age=300"
          gcloud storage objects update "gs://${BUCKET}/assets/**" \
            --cache-control="public, max-age=31536000, immutable"

      - name: Invalidate the CDN cache
        run: gcloud compute url-maps invalidate-cdn-cache agamim-catalog --path "/*" --async --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Smoke test the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL variable is not set"; exit 1; }
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$SITE_URL/") && [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code"; sleep 10
          done
          [ "$code" = "200" ] || { echo "site did not return 200"; exit 1; }
          grep -qi "<html" /tmp/index.html
          # No sign-in in this phase: the page must load the public-mode script that skips the login screen.
          grep -q "public-mode.js" /tmp/index.html || { echo "index.html does not load public-mode.js"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/public-mode.js"); [ "$code" = "200" ] || { echo "public-mode.js missing"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/data/consumer/layers.json"); [ "$code" = "200" ]
          for p in add-dataset.html admin-actions.js login.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$p"); [ "$code" = "404" ] || { echo "$p must not be public (got $code)"; exit 1; }
          done
          echo "smoke test passed"
