name: Check

# Runs on every pull request and every push. It never deploys.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Build and test the consumer site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate JSON data files
        run: |
          for f in $(find data -name '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "bad JSON: $f"; exit 1; }; done
      - name: Build dist/ from the allow-list
        run: npm run build:consumer
      - run: npx playwright install --with-deps chromium
      - name: Serve dist/
        run: |
          npx http-server dist -p 4180 -a 127.0.0.1 -c-1 --silent &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4180/ >/dev/null && exit 0; sleep 1; done
          echo 'server did not start'; exit 1
      - name: Test dist/ (consumer specs only)
        env:
          BASE_URL: http://127.0.0.1:4180
        run: npm run test:consumer
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  admin:
    name: Admin and server tests (source, not deployed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test add-dataset admin-actions
        continue-on-error: true   # advisory until the admin side is cleaned up

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
